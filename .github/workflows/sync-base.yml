name: sync-base

# Atualização da base do painel (Dashboard, Vendas e Engenharia) cinco vezes por dia: projetos (tick) e vendas.
# O GitHub agenda em UTC; Brasília é UTC-3 (sem horário de verão):
#   06:00 -> 09:00 UTC   09:00 -> 12:00 UTC   12:00 -> 15:00 UTC   15:00 -> 18:00 UTC   19:00 -> 22:00 UTC
# O GitHub pode atrasar alguns minutos o início de uma tarefa agendada em horários de pico.
# Também pode ser disparado à mão (Actions > sync-base > Run workflow).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'

concurrency:
  group: sync-base
  cancel-in-progress: false

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Atualizar a base do painel
        env:
          TOKEN: ${{ secrets.GRONER_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "segredo GRONER_SYNC_TOKEN não configurado"
            exit 1
          fi
          base=https://groner-crm-dashboard-ten.vercel.app/api/sync/groner
          falhou=0

          # Uma etapa por vez: mostra o resultado e só marca erro se o servidor não responder 200.
          chamar() {
            nome="$1"; caminho="$2"
            echo "== $nome"
            codigo=$(curl -sS --max-time 90 -X POST -H "X-Groner-Sync-Token: $TOKEN" -o resposta.txt -w '%{http_code}' "$base/$caminho") || codigo=000
            echo "HTTP $codigo"
            head -c 700 resposta.txt; echo
            if [ "$codigo" != "200" ]; then falhou=1; fi
          }

          # 1) Projetos (Dashboard e Engenharia): só os cards que mudaram desde o último tick.
          chamar "projetos (tick)" "projetos/tick"
          sleep 5
          # 2) Vendas: lista completa e, só das vendas novas, o detalhe que liga a venda ao card do Groner.
          # As propostas (3,7 mil registros) NÃO entram aqui: a carga completa passa dos 60 s da função da Vercel
          # (deu HTTP 504 no teste). Elas já são atualizadas uma vez por dia pelo cron da Vercel (vercel.json).
          chamar "vendas" "completa/vendas"

          if [ "$falhou" != "0" ]; then
            echo "Alguma etapa não respondeu 200: veja acima."
            exit 1
          fi
          echo "Base atualizada."
