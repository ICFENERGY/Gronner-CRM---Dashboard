name: sync-base

# Atualização da base do painel (Dashboard, Vendas e Engenharia) cinco vezes por dia, no horário certo:
#   06:00, 09:00, 12:00, 15:00 e 19:00 (Brasília, UTC-3, sem horário de verão) = 09, 12, 15, 18 e 22 UTC.
# O agendador do GitHub atrasa tarefas agendadas (já chegou a mais de 1 hora). Por isso o agendamento dispara UMA HORA
# ANTES do horário (08, 11, 14, 17 e 21 UTC) e a primeira etapa espera, com o relógio do servidor, até o minuto exato.
# Se o GitHub atrasar além disso, a atualização roda assim que a tarefa começar.
# O cronômetro do painel (src/lib/proximaAtualizacao.ts) usa estes mesmos horários.
# Também pode ser disparado à mão (Actions > sync-base > Run workflow): nesse caso roda na hora.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 11 * * *'
    - cron: '0 14 * * *'
    - cron: '0 17 * * *'
    - cron: '0 21 * * *'

concurrency:
  group: sync-base
  cancel-in-progress: false

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Esperar o horário marcado
        if: github.event_name == 'schedule'
        run: |
          # Horários da atualização em UTC. Alvo = primeiro horário que ainda não passou há mais de 2 horas.
          agora=$(date +%s)
          dia=$(date -u -d "$(date -u +%F) 00:00:00" +%s)
          alvo=0
          for d in -86400 0 86400; do
            for h in 9 12 15 18 22; do
              t=$((dia + d + h * 3600))
              if [ "$t" -gt $((agora - 7200)) ] && { [ "$alvo" = 0 ] || [ "$t" -lt "$alvo" ]; }; then alvo=$t; fi
            done
          done
          espera=$((alvo - agora))
          if [ "$espera" -gt 0 ]; then
            echo "Esperando ${espera}s até $(date -u -d "@$alvo" '+%H:%M UTC')"
            sleep "$espera"
          else
            echo "Atrasado em $((-espera))s: atualizando agora"
          fi
      - name: Atualizar a base do painel
        env:
          TOKEN: ${{ secrets.GRONER_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "segredo GRONER_SYNC_TOKEN não configurado"
            exit 1
          fi
          base=https://groner-crm-dashboard-ten.vercel.app/api/sync/groner
          falhou=0

          # Uma etapa por vez: mostra o resultado e só marca erro se o servidor não responder 200.
          chamar() {
            nome="$1"; caminho="$2"
            echo "== $nome"
            codigo=$(curl -sS --max-time 90 -X POST -H "X-Groner-Sync-Token: $TOKEN" -o resposta.txt -w '%{http_code}' "$base/$caminho") || codigo=000
            echo "HTTP $codigo"
            head -c 700 resposta.txt; echo
            if [ "$codigo" != "200" ]; then falhou=1; fi
          }

          # 1) Projetos (Dashboard e Engenharia): só os cards que mudaram desde o último tick.
          chamar "projetos (tick)" "projetos/tick"
          sleep 5
          # 2) Vendas: lista completa e, só das vendas novas, o detalhe que liga a venda ao card do Groner.
          # As propostas (3,7 mil registros) NÃO entram aqui: a carga completa passa dos 60 s da função da Vercel
          # (deu HTTP 504 no teste). Elas já são atualizadas uma vez por dia pelo cron da Vercel (vercel.json).
          chamar "vendas" "completa/vendas"

          if [ "$falhou" != "0" ]; then
            echo "Alguma etapa não respondeu 200: veja acima."
            exit 1
          fi
          echo "Base atualizada."
